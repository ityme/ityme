name: bonsai
on:
  schedule:
    - cron: '0 3 * * *'   # re-grow daily
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/bonsai.yml
permissions:
  contents: write
concurrency:
  group: profile-generated-assets
  cancel-in-progress: false
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: egorthinks/git-bonsai@v1
        with:
          commit: false

      - name: Commit generated bonsai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/bonsai.svg output/bonsai.png output/bonsai.gif output/bonsai-growth.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update git bonsai"
          git pull --rebase origin main
          git push
