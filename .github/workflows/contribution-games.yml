name: contribution games

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/bonsai.yml
      - .github/workflows/contribution-games.yml

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-snake.svg
            output/github-snake-dark.svg?palette=github-dark

      - name: Generate contribution breakout
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          output_path: output/breakout

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-snake.svg output/github-snake-dark.svg output/breakout/light.svg output/breakout/dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update contribution games"
          git pull --rebase origin main
          git push
